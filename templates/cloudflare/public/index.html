<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>One Brain Agent</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { max-width: 44rem; margin: 0 auto; padding: 1.5rem 1rem; line-height: 1.5; }
      h1 { font-size: 1.25rem; margin: 0 0 1rem; }
      .warning { border: 1px solid #d97706; background: #d9770618; padding: 0.75rem 1rem; border-radius: 0.5rem; }
      .warning:empty { display: none; }
      #log { display: flex; flex-direction: column; gap: 0.75rem; margin: 1rem 0; }
      .message { white-space: pre-wrap; padding: 0.6rem 0.9rem; border-radius: 0.75rem; }
      .user { align-self: flex-end; background: #2563eb; color: white; max-width: 85%; }
      .assistant { background: #8882; }
      .error { background: #dc262620; }
      form { display: flex; gap: 0.5rem; }
      input { flex: 1; font: inherit; padding: 0.5rem 0.75rem; border-radius: 0.5rem; border: 1px solid #8886; }
      button { font: inherit; padding: 0.5rem 1rem; border-radius: 0.5rem; border: 0; background: #2563eb; color: white; }
      button:disabled { opacity: 0.5; }
    </style>
  </head>
  <body>
    <h1>One Brain Agent</h1>
    <p id="warning" class="warning"></p>
    <div id="log"></div>
    <form id="ask">
      <input id="message" autocomplete="off" placeholder="Ask about your team's work" />
      <button id="send">Send</button>
    </form>
    <script type="module">
      const log = document.getElementById('log');
      const warning = document.getElementById('warning');
      const input = document.getElementById('message');
      const send = document.getElementById('send');
      const chat = localStorage.getItem('chat') ?? crypto.randomUUID();
      localStorage.setItem('chat', chat);

      const status = await fetch('/api/status').then((response) => response.json());
      const missing = [];
      if (!status.onebrainKey) missing.push('ONEBRAIN_API_KEY');
      if (!status.agentToken) missing.push('AGENT_TOKEN');
      if (missing.length) warning.textContent = `Set the ${missing.join(' and ')} secret${missing.length > 1 ? 's' : ''} for this Worker, then reload.`;

      function show(role, text) {
        const one = document.createElement('div');
        one.className = `message ${role}`;
        one.textContent = text;
        log.append(one);
        one.scrollIntoView({ block: 'end' });
      }

      document.getElementById('ask').addEventListener('submit', async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        let token = localStorage.getItem('token');
        if (!token) {
          token = prompt('The AGENT_TOKEN for this agent:')?.trim() ?? '';
          if (!token) return;
          localStorage.setItem('token', token);
        }
        show('user', message);
        input.value = '';
        send.disabled = true;
        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'content-type': 'application/json', authorization: `Bearer ${token}` },
            body: JSON.stringify({ chat, message }),
          });
          if (response.status === 401) localStorage.removeItem('token');
          const answer = await response.json();
          if (answer.error) show('error', answer.error);
          else show('assistant', answer.reply || '(no answer)');
        } catch {
          show('error', 'The agent could not be reached.');
        } finally {
          send.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
